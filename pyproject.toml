[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdpr-swe"
version = "1.0.0"
description = "Graph-Guided Dual-Process Reasoning for Offline Autonomous Software Engineering with Gemma-4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Agent Research Lab", email = "agent-research@kaggle.local"}
]
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "tabulate>=0.9"
]

[project.scripts]
gdpr-swe = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
